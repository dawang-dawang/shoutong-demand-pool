<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>售后需求收集平台</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="config.js"></script>
<style>
:root{
  --bg:#f5f7fa; --panel:#ffffff; --line:#e5e9f0; --line2:#eef1f6;
  --text:#1f2733; --text2:#5b6779; --text3:#8b96a8;
  --primary:#2f6fed; --primary-d:#1f56cc; --primary-soft:#eaf1fe;
  --red:#e5484d; --red-soft:#fdeded; --green:#2fa05a; --green-soft:#e8f7ee;
  --amber:#d97706; --amber-soft:#fdf3e3;
  --radius:10px; --shadow:0 1px 3px rgba(20,30,55,.08),0 4px 16px rgba(20,30,55,.06);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text);font-size:14px;line-height:1.6}
button{font-family:inherit;cursor:pointer}
input,select{font-family:inherit;font-size:14px}
a{color:var(--primary);text-decoration:none}

/* ===== 布局 ===== */
.topbar{position:sticky;top:0;z-index:50;background:var(--panel);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:16px;padding:0 20px;height:56px}
.topbar .brand{font-size:16px;font-weight:700;display:flex;align-items:center;gap:8px;white-space:nowrap}
.topbar .brand .dot{width:10px;height:10px;border-radius:3px;background:var(--red)}
.topbar nav{display:flex;gap:4px;flex:1;overflow-x:auto}
.topbar nav a{padding:6px 14px;border-radius:8px;color:var(--text2);font-weight:500;white-space:nowrap}
.topbar nav a.active{background:var(--primary-soft);color:var(--primary)}
.topbar .who{display:flex;align-items:center;gap:10px;color:var(--text2);font-size:13px;white-space:nowrap}
.topbar .who .role{font-size:11px;padding:1px 8px;border-radius:99px;background:var(--green-soft);color:var(--green)}
.topbar .who .role.admin{background:var(--amber-soft);color:var(--amber)}
.page{max-width:1180px;margin:0 auto;padding:20px}
@media (max-width:720px){.page{padding:12px}.topbar{padding:0 12px;gap:8px}.topbar .brand span.t{display:none}}

/* ===== 通用组件 ===== */
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.panel .phead{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 18px;border-bottom:1px solid var(--line2);flex-wrap:wrap}
.panel .phead h3{font-size:15px}
.panel .pbody{padding:18px}
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 16px;border-radius:8px;border:1px solid var(--line);background:var(--panel);color:var(--text);font-size:13px;font-weight:500;transition:.15s}
.btn:hover{border-color:#cfd7e3;background:#fafbfd}
.btn.primary{background:var(--primary);border-color:var(--primary);color:#fff}
.btn.primary:hover{background:var(--primary-d)}
.btn.danger{color:var(--red);border-color:#f3c2c4}
.btn.danger:hover{background:var(--red-soft)}
.btn.sm{padding:4px 10px;font-size:12px;border-radius:6px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.inp,.sel{padding:8px 12px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--text);outline:none;transition:.15s}
.inp:focus,.sel:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(47,111,237,.12)}
.chip{display:inline-block;padding:2px 10px;border-radius:99px;font-size:12px;font-weight:600;background:var(--red-soft);color:var(--red)}
.chip.gray{background:#f0f2f6;color:var(--text2)}
.chip.blue{background:var(--primary-soft);color:var(--primary)}
.chip.green{background:var(--green-soft);color:var(--green)}
.tagchip{display:inline-block;padding:1px 8px;margin:1px 3px 1px 0;border-radius:6px;font-size:12px;background:var(--red-soft);color:var(--red);font-weight:500}
.muted{color:var(--text3)} .small{font-size:12px}
.loading{padding:40px;text-align:center;color:var(--text3)}
.empty{padding:50px 20px;text-align:center;color:var(--text3)}
.toast{position:fixed;top:70px;left:50%;transform:translateX(-50%);z-index:99;padding:10px 22px;border-radius:10px;background:#232a36;color:#fff;font-size:13px;box-shadow:0 6px 24px rgba(0,0,0,.25);opacity:0;transition:.25s;pointer-events:none}
.toast.show{opacity:1}
.toast.err{background:var(--red)}

/* ===== 表格 ===== */
.tblwrap{overflow-x:auto}
table.tbl{width:100%;border-collapse:collapse;font-size:13px}
table.tbl th{position:sticky;top:0;background:#f8fafc;text-align:left;padding:10px 12px;color:var(--text2);font-weight:600;border-bottom:1px solid var(--line);white-space:nowrap}
table.tbl td{padding:10px 12px;border-bottom:1px solid var(--line2);vertical-align:top}
table.tbl tr:hover td{background:#fafcff}
table.tbl .no{font-family:ui-monospace,Consolas,monospace;color:var(--primary);font-weight:600;cursor:pointer}
.ellipsis{max-width:280px;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}

/* ===== 登录页 ===== */
.login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:linear-gradient(135deg,#f5f7fa 0%,#e9effc 100%)}
.login-card{width:100%;max-width:380px;background:#fff;border-radius:16px;box-shadow:0 8px 40px rgba(31,86,204,.12);padding:36px 32px}
.login-card h1{font-size:20px;margin-bottom:4px}
.login-card .sub{color:var(--text3);font-size:13px;margin-bottom:26px}
.login-card .field{margin-bottom:16px}
.login-card label{display:block;font-size:13px;color:var(--text2);margin-bottom:6px;font-weight:500}
.login-card .inp{width:100%;padding:11px 14px}
.login-card .btn{width:100%;justify-content:center;padding:11px;font-size:15px;margin-top:8px}
.login-err{background:var(--red-soft);color:var(--red);padding:9px 14px;border-radius:8px;font-size:13px;margin-bottom:14px;display:none}

/* ===== 筛选栏 ===== */
.filters{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}
.filters .f{display:flex;flex-direction:column;gap:4px}
.filters .f label{font-size:12px;color:var(--text3)}
.pager{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 18px;border-top:1px solid var(--line2);flex-wrap:wrap}
.pager .pages{display:flex;gap:6px;align-items:center}
.pager .pg{min-width:32px;padding:4px 8px;text-align:center;border-radius:6px;border:1px solid var(--line);background:#fff;cursor:pointer;font-size:13px}
.pager .pg.cur{background:var(--primary);border-color:var(--primary);color:#fff}
.pager .pg.dis{opacity:.4;cursor:not-allowed}

/* ===== 统计卡 ===== */
.statrow{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:14px;margin-bottom:18px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px;box-shadow:var(--shadow)}
.stat .v{font-size:26px;font-weight:700;line-height:1.2}
.stat .k{font-size:12px;color:var(--text3);margin-top:2px}
.chartbox{height:240px;position:relative}

/* ===== 详情页 ===== */
.detail-grid{display:grid;grid-template-columns:1fr;gap:16px}
.kv{display:grid;grid-template-columns:110px 1fr;gap:8px 14px;font-size:13px}
.kv dt{color:var(--text3)}
.kv dd{word-break:break-all}
.chat{display:flex;flex-direction:column;gap:12px;padding:6px 0}
.msg{display:flex;gap:10px;max-width:86%}
.msg .avatar{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:#fff;flex-shrink:0;background:#9aa7ba}
.msg .bubble{background:#f2f5fa;border:1px solid var(--line2);border-radius:4px 12px 12px 12px;padding:8px 12px}
.msg .meta{font-size:11px;color:var(--text3);margin-bottom:3px}
.msg .ct{white-space:pre-wrap;word-break:break-word;font-size:13px}
.msg.user{align-self:flex-start}
.msg.staff{align-self:flex-end;flex-direction:row-reverse}
.msg.staff .avatar{background:var(--primary)}
.msg.staff .bubble{background:var(--primary-soft);border-color:#d3e1fb;border-radius:12px 4px 12px 12px}
.msg.staff .meta{text-align:right}

/* ===== 管理页 ===== */
.adm-sec{margin-bottom:18px}
h2.sec{font-size:16px;margin-bottom:12px;display:flex;align-items:center;gap:8px}
h2.sec::before{content:"";width:4px;height:16px;border-radius:2px;background:var(--primary)}
.badge{display:inline-block;padding:1px 8px;border-radius:99px;font-size:11px;font-weight:600}
.badge.success{background:var(--green-soft);color:var(--green)}
.badge.failed{background:var(--red-soft);color:var(--red)}
.badge.running{background:var(--amber-soft);color:var(--amber)}
</style>
</head>
<body>
<div id="app"></div>
<div id="toast" class="toast"></div>

<script>
/* ================= 配置 ================= */
const CFG = window.__APP_CONFIG__ || {};
if (!CFG.SUPABASE_URL || !CFG.SUPABASE_ANON_KEY) {
  document.getElementById('app').innerHTML = '<div class="empty">缺少 config.js 配置（SUPABASE_URL / SUPABASE_ANON_KEY）</div>';
  throw new Error('missing config');
}
const sb = window.supabase.createClient(CFG.SUPABASE_URL, CFG.SUPABASE_ANON_KEY);
const EMAIL_DOMAIN = '@shoutong.local';

/* ================= 工具 ================= */
const $ = (s, el) => (el || document).querySelector(s);
const $$ = (s, el) => Array.from((el || document).querySelectorAll(s));
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
function fmtTime(t, withSec) {
  if (!t) return '—';
  const d = new Date(t);
  if (isNaN(d)) return String(t);
  return d.toLocaleString('zh-CN', { timeZone: 'Asia/Shanghai', hour12: false, year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit', ...(withSec ? { second: '2-digit' } : {}) }).replace(/\//g, '-');
}
const STATUS_MAP = { 1: '排队中', 2: '处理中', 3: '已完成', 6: '已取消' };
const statusText = (n) => STATUS_MAP[n] || ('状态' + n);
const statusChip = (n) => {
  const cls = n === 3 ? 'green' : n === 2 ? 'blue' : 'gray';
  return `<span class="chip ${cls}">${esc(statusText(n))}</span>`;
};
const tagChips = (tags) => (tags || '').split(',').filter(Boolean).map((t) => `<span class="tagchip">${esc(t.trim())}</span>`).join('');
/* 售后通会话内容常带 <p> 等 HTML 标签，展示/导出前剥掉 */
const stripHtml = (s) => String(s == null ? '' : s).replace(/<br\s*\/?>/gi, '\n').replace(/<\/p>\s*<p[^>]*>/gi, '\n').replace(/<[^>]+>/g, '').replace(/&nbsp;/g, ' ').replace(/&amp;/g, '&').replace(/&lt;/g, '<').replace(/&gt;/g, '>').trim();
function toast(msg, isErr) {
  const el = $('#toast');
  el.textContent = msg;
  el.className = 'toast show' + (isErr ? ' err' : '');
  clearTimeout(el.__t);
  el.__t = setTimeout(() => { el.className = 'toast'; }, 2600);
}

/* ================= 全局状态 ================= */
const state = {
  session: null,
  profile: null,
  route: { name: 'login', param: null },
  // 列表页
  filters: { assignee: '', software: '', tag: '', ym: '', start: '', end: '', kw: '' },
  page: 1,
  pageSize: 20,
  dicts: { assignees: [], softwares: [], tags: [], yms: [] },
  renderSeq: 0,
};
const isStale = (my) => my !== undefined && my !== state.renderSeq;

/* ================= 鉴权 ================= */
async function initAuth() {
  const { data } = await sb.auth.getSession();
  state.session = data.session;
  if (state.session) await loadProfile();
  sb.auth.onAuthStateChange(async (evt, sess) => {
    state.session = sess;
    state.profile = null;
    if (sess) { await loadProfile(); }
    route();
  });
}
async function loadProfile() {
  try {
    const { data, error } = await sb.from('profiles').select('*').eq('id', state.session.user.id).single();
    if (error) throw error;
    state.profile = data;
  } catch (e) {
    state.profile = null;
  }
}
async function doLogin(phone, password) {
  const email = phone.trim() + EMAIL_DOMAIN;
  // 网络偶发抖动（Failed to fetch）时自动重试，最多 3 次
  let lastErr = null;
  for (let attempt = 0; attempt < 3; attempt++) {
    try {
      const { data, error } = await sb.auth.signInWithPassword({ email, password });
      if (error) throw new Error(error.message === 'Invalid login credentials' ? '手机号或密码错误' : error.message);
      state.session = data.session;
      await loadProfile();
      if (!state.profile) throw new Error('账号档案不存在，请联系管理员');
      if (state.profile.status !== 'active') { await sb.auth.signOut(); throw new Error('账号已停用，请联系管理员'); }
      return;
    } catch (e) {
      lastErr = e;
      const transient = /failed to fetch|network|timeout|abort/i.test(String(e && e.message));
      if (!transient || attempt === 2) throw e;
      await new Promise((r) => setTimeout(r, 1200));
    }
  }
  throw lastErr;
}
async function doLogout() { await sb.auth.signOut(); location.hash = '#/login'; }

/* ================= 路由 ================= */
function parseHash() {
  const h = location.hash.replace(/^#\/?/, '');
  if (h.startsWith('detail/')) return { name: 'detail', param: decodeURIComponent(h.slice(7)) };
  if (h === 'list') return { name: 'list' };
  if (h === 'admin') return { name: 'admin' };
  return { name: 'login' };
}
async function route() {
  const r = parseHash();
  if (!state.session) {
    if (r.name !== 'login') { location.hash = '#/login'; return; }
    renderLogin(); return;
  }
  if (!state.profile) { await loadProfile(); }
  if (!state.profile) { renderLogin('档案读取失败，请重新登录'); return; }
  if (r.name === 'login') { location.hash = '#/list'; return; }
  state.route = r;
  const my = ++state.renderSeq; // 渲染代际：防止快速跳转时旧渲染覆盖新页面
  renderShell();
  if (r.name === 'list') renderList(my);
  else if (r.name === 'detail') renderDetail(r.param, my);
  else if (r.name === 'admin') {
    if (state.profile.role !== 'admin') { $('#pageBody').innerHTML = '<div class="empty">仅管理员可访问</div>'; return; }
    renderAdmin(my);
  }
}
window.addEventListener('hashchange', route);

/* ================= 页面骨架 ================= */
function renderShell() {
  const isAdmin = state.profile && state.profile.role === 'admin';
  const r = state.route.name;
  $('#app').innerHTML = `
    <div class="topbar">
      <div class="brand"><span class="dot"></span><span class="t">售后需求收集平台</span></div>
      <nav>
        <a href="#/list" class="${r === 'list' || r === 'detail' ? 'active' : ''}">需求工单</a>
        ${isAdmin ? `<a href="#/admin" class="${r === 'admin' ? 'active' : ''}">系统管理</a>` : ''}
      </nav>
      <div class="who">
        <span>${esc(state.profile.display_name || state.profile.phone || '')}</span>
        <span class="role ${isAdmin ? 'admin' : ''}">${isAdmin ? '管理员' : '用户'}</span>
        <button class="btn sm" id="btnLogout">退出</button>
      </div>
    </div>
    <div class="page" id="pageBody"><div class="loading">加载中…</div></div>`;
  $('#btnLogout').onclick = doLogout;
}

/* ================= 登录页 ================= */
function renderLogin(err) {
  $('#app').innerHTML = `
    <div class="login-wrap">
      <div class="login-card">
        <h1>售后需求收集平台</h1>
        <div class="sub">登录查看售后通同步的需求工单 · 数据只读</div>
        <div class="login-err" id="loginErr">${err ? esc(err) : ''}</div>
        <div class="field">
          <label>手机号</label>
          <input class="inp" id="inpPhone" type="tel" maxlength="11" placeholder="请输入手机号" autocomplete="username">
        </div>
        <div class="field">
          <label>密码</label>
          <input class="inp" id="inpPwd" type="password" placeholder="请输入密码" autocomplete="current-password">
        </div>
        <button class="btn primary" id="btnLogin">登 录</button>
      </div>
    </div>`;
  if (err) $('#loginErr').style.display = 'block';
  const submit = async () => {
    const phone = $('#inpPhone').value.trim();
    const pwd = $('#inpPwd').value;
    if (!/^1\d{10}$/.test(phone)) { $('#loginErr').textContent = '请输入 11 位手机号'; $('#loginErr').style.display = 'block'; return; }
    if (!pwd) { $('#loginErr').textContent = '请输入密码'; $('#loginErr').style.display = 'block'; return; }
    const btn = $('#btnLogin'); btn.disabled = true; btn.textContent = '登录中…';
    try {
      await doLogin(phone, pwd);
      location.hash = '#/list';
    } catch (e) {
      $('#loginErr').textContent = e.message; $('#loginErr').style.display = 'block';
      btn.disabled = false; btn.textContent = '登 录';
    }
  };
  $('#btnLogin').onclick = submit;
  $('#inpPwd').onkeydown = (e) => { if (e.key === 'Enter') submit(); };
  $('#inpPhone').onkeydown = (e) => { if (e.key === 'Enter') $('#inpPwd').focus(); };
}

/* ================= 列表页 ================= */
async function ensureDicts() {
  if (state.dicts.softwares.length) return;
  const [{ data: sw }, { data: tk }, { data: ym }] = await Promise.all([
    sb.from('software_dict').select('name').order('name'),
    sb.from('tickets').select('assignee,tags'),
    sb.from('v_monthly_stats').select('ym'),
  ]);
  state.dicts.softwares = (sw || []).map((x) => x.name);
  const aset = new Set(), tset = new Set(), ymset = new Set();
  (tk || []).forEach((x) => {
    if (x.assignee) aset.add(x.assignee);
    (x.tags || '').split(',').forEach((t) => { t = t.trim(); if (t) tset.add(t); });
  });
  (ym || []).forEach((x) => x.ym && ymset.add(x.ym));
  state.dicts.assignees = [...aset].sort();
  state.dicts.tags = [...tset].sort();
  state.dicts.yms = [...ymset].sort().reverse();
}

async function renderList(my) {
  const pb = $('#pageBody');
  pb.innerHTML = '<div class="loading">加载中…</div>';
  await ensureDicts();
  if (isStale(my)) return;
  const f = state.filters;
  const opt = (arr, cur, allLabel) => `<option value="">${allLabel}</option>` + arr.map((x) => `<option value="${esc(x)}" ${x === cur ? 'selected' : ''}>${esc(x)}</option>`).join('');

  pb.innerHTML = `
    <div id="statArea"></div>
    <div class="panel">
      <div class="phead">
        <h3>需求工单列表</h3>
        <div style="display:flex;gap:8px;flex-wrap:wrap">
          <button class="btn sm" id="btnRefresh">刷新</button>
          <button class="btn sm primary" id="btnExport">导出 Excel</button>
        </div>
      </div>
      <div class="pbody" style="padding-bottom:8px">
        <div class="filters">
          <div class="f"><label>指派给</label><select class="sel" id="fAssignee">${opt(state.dicts.assignees, f.assignee, '全部')}</select></div>
          <div class="f"><label>软件名称</label><select class="sel" id="fSoftware">${opt(state.dicts.softwares, f.software, '全部')}</select></div>
          <div class="f"><label>工单标签</label><select class="sel" id="fTag">${opt(state.dicts.tags, f.tag, '全部')}</select></div>
          <div class="f"><label>月份</label><select class="sel" id="fYm">${opt(state.dicts.yms, f.ym, '全部')}</select></div>
          <div class="f"><label>开始日期</label><input class="inp" type="date" id="fStart" value="${esc(f.start)}"></div>
          <div class="f"><label>结束日期</label><input class="inp" type="date" id="fEnd" value="${esc(f.end)}"></div>
          <div class="f" style="flex:1;min-width:160px"><label>关键词（需求内容/公司/工单号）</label><input class="inp" id="fKw" placeholder="模糊搜索" value="${esc(f.kw)}"></div>
          <button class="btn primary" id="btnSearch">查询</button>
          <button class="btn" id="btnReset">重置</button>
        </div>
      </div>
      <div class="tblwrap" id="tblArea"><div class="loading">查询中…</div></div>
      <div class="pager" id="pagerArea"></div>
    </div>`;

  const readFilters = () => {
    state.filters = {
      assignee: $('#fAssignee').value, software: $('#fSoftware').value, tag: $('#fTag').value,
      ym: $('#fYm').value, start: $('#fStart').value, end: $('#fEnd').value, kw: $('#fKw').value.trim(),
    };
  };
  $('#btnSearch').onclick = () => { readFilters(); state.page = 1; loadTable(); };
  $('#btnReset').onclick = () => { state.filters = { assignee: '', software: '', tag: '', ym: '', start: '', end: '', kw: '' }; state.page = 1; renderList(); };
  $('#btnRefresh').onclick = () => { state.dicts = { assignees: [], softwares: [], tags: [], yms: [] }; renderList(); };
  $('#btnExport').onclick = () => exportExcel();
  $('#fKw').onkeydown = (e) => { if (e.key === 'Enter') { readFilters(); state.page = 1; loadTable(); } };

  renderStats();
  loadTable();
}

function buildQuery() {
  const f = state.filters;
  let q = sb.from('tickets').select('*', { count: 'exact' }).order('created_at_src', { ascending: false });
  if (f.assignee) q = q.eq('assignee', f.assignee);
  if (f.software) q = q.eq('software_name', f.software);
  if (f.tag) q = q.ilike('tags', '%' + f.tag.replace(/[%_,]/g, '') + '%');
  if (f.ym) {
    const [y, m] = f.ym.split('-').map(Number);
    const start = new Date(Date.UTC(y, m - 1, 1, -8));       // 北京时间月初
    const end = new Date(Date.UTC(y, m, 1, -8));
    q = q.gte('created_at_src', start.toISOString()).lt('created_at_src', end.toISOString());
  }
  if (f.start) q = q.gte('created_at_src', new Date(f.start + 'T00:00:00+08:00').toISOString());
  if (f.end) q = q.lt('created_at_src', new Date(f.end + 'T00:00:00+08:00').getTime() + 86400000 ? new Date(new Date(f.end + 'T00:00:00+08:00').getTime() + 86400000).toISOString() : f.end);
  if (f.kw) {
    const kw = f.kw.replace(/[%_,()]/g, '');
    if (kw) q = q.or(`remark.ilike.%${kw}%,title.ilike.%${kw}%,company.ilike.%${kw}%,customer.ilike.%${kw}%,ticket_no.ilike.%${kw}%`);
  }
  return q;
}

async function loadTable() {
  const area = $('#tblArea');
  area.innerHTML = '<div class="loading">查询中…</div>';
  const from = (state.page - 1) * state.pageSize;
  const { data, error, count } = await buildQuery().range(from, from + state.pageSize - 1);
  if (error) { area.innerHTML = `<div class="empty">查询失败：${esc(error.message)}</div>`; return; }
  if (!data || !data.length) {
    area.innerHTML = '<div class="empty">没有符合条件的需求工单</div>';
    $('#pagerArea').innerHTML = '';
    return;
  }
  area.innerHTML = `
    <table class="tbl">
      <thead><tr>
        <th>工单编号</th><th>指派给</th><th>发起时间</th><th>软件名称</th>
        <th>工单标签</th><th>需求内容</th><th>公司名称</th><th>类型</th><th>状态</th>
      </tr></thead>
      <tbody>${data.map((t) => `
        <tr>
          <td class="no" data-no="${esc(t.ticket_no)}">${esc(t.ticket_no)}</td>
          <td>${esc(t.assignee || '—')}</td>
          <td style="white-space:nowrap">${fmtTime(t.created_at_src)}</td>
          <td>${esc(t.software_name || '—')}</td>
          <td>${tagChips(t.tags)}</td>
          <td><div class="ellipsis" title="${esc(t.remark || '')}">${esc(t.remark || t.title || '—')}</div></td>
          <td><div class="ellipsis" style="max-width:180px" title="${esc(t.company || '')}">${esc((t.company || '').replace(/^（[^）]*）/, '') || '—')}</div></td>
          <td>${esc(t.work_type || '—')}</td>
          <td>${statusChip(t.status)}</td>
        </tr>`).join('')}
      </tbody>
    </table>`;
  $$('.no', area).forEach((el) => { el.onclick = () => { location.hash = '#/detail/' + encodeURIComponent(el.dataset.no); }; });

  const total = count || 0;
  const pages = Math.max(1, Math.ceil(total / state.pageSize));
  let pgs = '';
  const mk = (p, label, cls) => `<button class="pg ${cls || ''}" data-p="${p}" ${cls === 'dis' ? 'disabled' : ''}>${label}</button>`;
  pgs += mk(state.page - 1, '‹', state.page <= 1 ? 'dis' : '');
  const win = [];
  for (let p = Math.max(1, state.page - 2); p <= Math.min(pages, state.page + 2); p++) win.push(p);
  if (win[0] > 1) { pgs += mk(1, '1'); if (win[0] > 2) pgs += '<span class="muted">…</span>'; }
  win.forEach((p) => { pgs += mk(p, p, p === state.page ? 'cur' : ''); });
  if (win[win.length - 1] < pages) { if (win[win.length - 1] < pages - 1) pgs += '<span class="muted">…</span>'; pgs += mk(pages, pages); }
  pgs += mk(state.page + 1, '›', state.page >= pages ? 'dis' : '');
  $('#pagerArea').innerHTML = `
    <span class="muted small">共 ${total} 条 · 第 ${state.page}/${pages} 页</span>
    <div class="pages">${pgs}</div>`;
  $$('#pagerArea .pg').forEach((el) => {
    el.onclick = () => { const p = Number(el.dataset.p); if (p >= 1 && p <= pages && p !== state.page) { state.page = p; loadTable(); } };
  });
}

async function renderStats() {
  const area = $('#statArea');
  try {
    const [{ data: ymData }, { data: asData }, { count: totalCount }, { data: cfgData }] = await Promise.all([
      sb.from('v_monthly_stats').select('*'),
      sb.from('v_assignee_stats').select('*'),
      sb.from('tickets').select('*', { count: 'exact', head: true }),
      state.profile.role === 'admin' ? sb.from('app_config').select('value').eq('key', 'last_sync_at').single() : Promise.resolve({ data: null }),
    ]);
    const months = [...new Set((ymData || []).map((x) => x.ym))].sort();
    const byMonth = months.map((m) => (ymData || []).filter((x) => x.ym === m).reduce((s, x) => s + Number(x.ticket_count), 0));
    const curYm = months[months.length - 1];
    const curTotal = byMonth[byMonth.length - 1] || 0;
    const curAs = (asData || []).filter((x) => x.ym === curYm).sort((a, b) => b.ticket_count - a.ticket_count);
    const lastSync = cfgData && cfgData.value ? fmtTime(cfgData.value) : '—';

    area.innerHTML = `
      <div class="statrow">
        <div class="stat"><div class="v">${totalCount || 0}</div><div class="k">需求工单总数</div></div>
        <div class="stat"><div class="v">${curTotal}</div><div class="k">${curYm ? curYm.replace('-', ' 年 ') + ' 月新增' : '本月新增'}</div></div>
        <div class="stat"><div class="v">${months.length}</div><div class="k">覆盖月份</div></div>
        <div class="stat"><div class="v" style="font-size:15px;line-height:38px">${lastSync}</div><div class="k">最近同步时间</div></div>
      </div>
      <div class="panel" style="margin-bottom:18px">
        <div class="phead"><h3>月度趋势</h3><span class="muted small">${curYm || ''} 各负责人：${curAs.map((x) => `${esc(x.assignee || '未指派')} ${x.ticket_count}`).join(' · ') || '—'}</span></div>
        <div class="pbody"><div class="chartbox"><canvas id="ymChart"></canvas></div></div>
      </div>`;
    if (window.Chart && months.length) {
      new Chart($('#ymChart'), {
        type: 'bar',
        data: { labels: months, datasets: [{ label: '需求工单数', data: byMonth, backgroundColor: '#e5484d', borderRadius: 6, maxBarThickness: 40 }] },
        options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } }, scales: { y: { beginAtZero: true, ticks: { precision: 0 } } } },
      });
    }
  } catch (e) { area.innerHTML = ''; }
}

/* ---------- 导出 ---------- */
async function exportExcel() {
  const btn = $('#btnExport');
  btn.disabled = true; btn.textContent = '导出中…';
  try {
    const { data: tickets, error } = await buildQuery().range(0, 9999);
    if (error) throw error;
    if (!tickets || !tickets.length) { toast('没有可导出的数据', true); return; }
    const nos = tickets.map((t) => t.ticket_no);
    const { data: msgs } = await sb.from('ticket_messages').select('*').in('ticket_no', nos).order('ticket_no').order('seq');

    const wb = XLSX.utils.book_new();
    const tHead = ['工单编号', '指派给', '发起时间', '软件名称', '工单标签', '需求内容', '工单类型', '公司名称', '客户', '状态'];
    const tRows = tickets.map((t) => [t.ticket_no, t.assignee, fmtTime(t.created_at_src, true), t.software_name, t.tags, t.remark || t.title, t.work_type, t.company, t.customer, statusText(t.status)]);
    const ws1 = XLSX.utils.aoa_to_sheet([tHead, ...tRows]);
    ws1['!cols'] = [{ wch: 13 }, { wch: 8 }, { wch: 19 }, { wch: 10 }, { wch: 14 }, { wch: 60 }, { wch: 10 }, { wch: 30 }, { wch: 10 }, { wch: 8 }];
    XLSX.utils.book_append_sheet(wb, ws1, '需求工单');

    const mHead = ['工单编号', '序号', '时间', '角色', '姓名', '内容'];
    const mRows = (msgs || []).map((m) => [m.ticket_no, m.seq, fmtTime(m.speak_time, true), m.speaker_role, m.speaker_name, stripHtml(m.content)]);
    const ws2 = XLSX.utils.aoa_to_sheet([mHead, ...mRows]);
    ws2['!cols'] = [{ wch: 13 }, { wch: 5 }, { wch: 19 }, { wch: 6 }, { wch: 10 }, { wch: 80 }];
    XLSX.utils.book_append_sheet(wb, ws2, '会话记录');

    const name = `需求工单_${new Date().toLocaleDateString('zh-CN', { timeZone: 'Asia/Shanghai' }).replace(/\//g, '')}.xlsx`;
    XLSX.writeFile(wb, name);
    toast(`已导出 ${tickets.length} 条工单、${(msgs || []).length} 条会话`);
  } catch (e) {
    toast('导出失败：' + e.message, true);
  } finally {
    btn.disabled = false; btn.textContent = '导出 Excel';
  }
}

      if (error) { toast('操作失败：' + error.message, true); el.disabled = false; }
      else { toast('已标记解决'); renderAdmin(); }
    };
  });
  $$('[data-role]', pb).forEach((el) => {

      const next = el.dataset.cur === 'admin' ? 'user' : 'admin';
      if (!confirm(`确定将该用户${next === 'admin' ? '设为管理员' : '降为普通用户'}？`)) return;

      if (error) toast('操作失败：' + error.message, true); else { toast('已更新'); renderAdmin(); }
    };
  });
  $$('.no', pb).forEach((el) => {
    if (el.dataset.no) el.onclick = () => { location.hash = '#/detail/' + encodeURIComponent(el.dataset.no); };
  });

  initSyncPanel();
}

/* ================= 手动同步面板（本地服务 127.0.0.1:8730） ================= */
const SYNC_API = 'http://127.0.0.1:8730';
function fetchT(url, opt, ms) {
  const ctl = new AbortController();
  const t = setTimeout(() => ctl.abort(), ms || 4000);
  return fetch(url, { ...(opt || {}), signal: ctl.signal }).finally(() => clearTimeout(t));
}
async function initSyncPanel() {
  const el = $('#syncPanel');
  if (!el) return;
  if (window.__syncPoll) { clearInterval(window.__syncPoll); window.__syncPoll = null; }
  let online = false;
  try { const r = await fetchT(SYNC_API + '/api/ping', null, 2500); online = r.ok; } catch (e) {}
  if (!online) {
    el.innerHTML = `
      <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">
        <span class="chip gray">同步服务离线</span>
        <span class="muted small">手动同步需要采集机上的本地服务在线。启动命令：</span>
      </div>
      <div style="background:#f6f8fb;border:1px solid var(--line);border-radius:8px;padding:10px 14px;margin-top:8px;font-family:ui-monospace,Consolas,monospace;color:#334">cd /d D:\\我的软件\\售后通需求池 &amp;&amp; node src\\tools\\start.js</div>
      <div class="muted small" style="margin-top:6px">自动同步每 60 分钟执行一次，不受此影响。</div>`;
    return;
  }
  const render = (st) => {
    const running = st && (st.state === 'running' || st.state === 'waiting_captcha');
    let html = `
      <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">
        <span class="chip green">同步服务在线</span>
        <button class="btn primary sm" id="btnSyncIncr" ${running ? 'disabled' : ''}>立即增量同步</button>
        <button class="btn sm" id="btnSyncFull" ${running ? 'disabled' : ''}>全量同步</button>
        ${st && st.finishedAt ? `<span class="muted small">上次：${st.state === 'success' ? '成功' : '失败'} · ${fmtTime(st.finishedAt)}</span>` : ''}
      </div>`;
    if (st && st.state === 'waiting_captcha') {
      html += `
        <div style="margin-top:12px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;background:var(--amber-soft);border:1px solid #f2dfb8;border-radius:10px;padding:12px 16px">
          <span style="font-weight:600;color:var(--amber)">需要登录验证码</span>
          <img src="${SYNC_API}/api/captcha.png?t=${Date.now()}" style="height:40px;border-radius:6px;border:1px solid var(--line);background:#fff" alt="验证码">
          <input class="inp" id="capAnswer" maxlength="4" placeholder="4 位数字" style="width:110px">
          <button class="btn primary sm" id="btnCap">提交</button>
        </div>`;
    } else if (running) {
      html += `<div class="muted small" style="margin-top:10px">同步进行中…（登录售后通 → 拉取工单 → 写库，约需 1-8 分钟）</div>`;
    }
    if (st && st.tail && st.tail.length && running) {
      html += `<div style="margin-top:10px;background:#1f2733;color:#c9d4e5;border-radius:8px;padding:10px 14px;font-family:ui-monospace,Consolas,monospace;font-size:11px;max-height:150px;overflow:auto">${st.tail.slice(-8).map((l) => esc(l)).join('<br>')}</div>`;
    }
    el.innerHTML = html;
    if (!running) {
      const go = (mode) => async () => {
        try {
          const r = await fetchT(SYNC_API + '/api/sync', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ mode }) });
          const j = await r.json();
          if (!r.ok) { toast(j.error || '触发失败', true); return; }
          toast((mode === 'full' ? '全量' : '增量') + '同步已启动');
          poll();
        } catch (e) { toast('无法连接同步服务', true); }
      };
      const b1 = $('#btnSyncIncr'), b2 = $('#btnSyncFull');
      if (b1) b1.onclick = go('incr');
      if (b2) b2.onclick = go('full');
    }
    const capBtn = $('#btnCap');
    if (capBtn) {
      const submitCap = async () => {
        const v = $('#capAnswer').value.trim();
        if (!/^\d{4}$/.test(v)) { toast('请输入 4 位数字', true); return; }
        await fetchT(SYNC_API + '/api/captcha', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ answer: v }) });
        toast('验证码已提交');
      };
      capBtn.onclick = submitCap;
      $('#capAnswer').onkeydown = (e) => { if (e.key === 'Enter') submitCap(); };
    }
  };
  const poll = async () => {
    try {
      const r = await fetchT(SYNC_API + '/api/sync/state');
      const st = await r.json();
      const wasRunning = window.__syncWasRunning;
      render(st);
      const running = st.state === 'running' || st.state === 'waiting_captcha';
      window.__syncWasRunning = running;
      if (running) {
        if (!window.__syncPoll) window.__syncPoll = setInterval(poll, 3000);
      } else {
        if (window.__syncPoll) { clearInterval(window.__syncPoll); window.__syncPoll = null; }
        if (wasRunning) {
          toast(st.state === 'success' ? '同步完成' : '同步失败', st.state !== 'success');
          renderAdmin();
        }
      }
    } catch (e) { /* 服务掉线，静默 */ }
  };
  await poll();
}

/* ================= 启动 ================= */
(async function boot() {
  await initAuth();
  route();
})();
</script>
</body>
</html>
